# Host nginx vhost for Monify. Install on the VPS:
#   sudo cp deploy/nginx/monify.gewall.my.id.conf /etc/nginx/sites-available/monify.gewall.my.id
#   sudo ln -s /etc/nginx/sites-available/monify.gewall.my.id /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d monify.gewall.my.id
# certbot rewrites this file to add the listen 443 / ssl_certificate lines and
# an http->https redirect.

server {
    listen 80;
    listen [::]:80;
    server_name monify.gewall.my.id;

    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
