services:
  # Pre-built image from GitHub Actions (ghcr.io/gewall/monify-go).
  # Override MONIFY_IMAGE in .env to pin a tag:
  #   MONIFY_IMAGE=ghcr.io/gewall/monify-go:sha-abc1234
  app:
    image: ${MONIFY_IMAGE:-ghcr.io/gewall/monify-go:latest}
    pull_policy: always
    restart: unless-stopped
    environment:
      APP_ENV: production
      APP_ADDR: ":8080"
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
      SESSION_SECURE: "true"
    ports:
      # Loopback only; the host nginx terminates TLS and reverse-proxies here.
      - "127.0.0.1:${APP_PORT:-8090}:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - shared-db

  # One-shot: applies embedded goose migrations against DATABASE_URL, then exits.
  migrate:
    image: ${MONIFY_IMAGE:-ghcr.io/gewall/monify-go:latest}
    command: ["migrate"]
    pull_policy: always
    restart: "no"
    environment:
      DATABASE_URL: ${DATABASE_URL:?set DATABASE_URL}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET}
    networks:
      - shared-db

# Postgres is the shared stack (~/infra/postgres). The app reaches it as host
# "postgres" over this external network. No bundled db service here.
networks:
  shared-db:
    external: true
